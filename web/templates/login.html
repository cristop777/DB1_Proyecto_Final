{% extends "base.html" %}
{% block title %}Iniciar sesión · Auto Auditoría{% endblock %}
{% block content %}
<section class="login-card card">
  <p class="eyebrow">Acceso al sistema</p>
  <h1>Inicia sesión</h1>
  <p class="muted login-description">Ingresa con tu usuario y contraseña.</p>
  <form method="post" action="{{ url_for('login') }}" class="login-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Usuario<input name="usuario" type="text" autocomplete="username" required autofocus></label>
    <label>Contraseña<input name="contrasena" type="password" autocomplete="current-password" required></label>
    <button class="button" type="submit">Entrar</button>
  </form>
</section>
{% endblock %}
